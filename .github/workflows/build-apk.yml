
name: Build APK from ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - 'apk_src.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check ZIP file
        run: |
          if [ ! -f apk_src.zip ]; then
            echo "ERROR: apk_src.zip tidak ditemukan di root!"
            exit 1
          fi

      - name: Extract source ZIP
        run: |
          mkdir -p source
          unzip -q apk_src.zip -d source

          echo "Isi hasil ekstrak:"
          ls -la source

      - name: Locate Gradle project
        run: |
          PROJECT_DIR=$(find source -name settings.gradle -o -name settings.gradle.kts | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle(.kts) tidak ditemukan!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_DIR")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Project ditemukan: $PROJECT_DIR"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: |
          cd "$PROJECT_DIR"
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NexendFLY-APK
          path: |
            ${{ env.PROJECT_DIR }}/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          
