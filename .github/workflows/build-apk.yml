
name: Build NexendFLY APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'apk_src.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract ZIP
        run: |
          test -f apk_src.zip
          mkdir source
          unzip -q apk_src.zip -d source

      - name: Locate project
        run: |
          FILE=$(find source -name settings.gradle -o -name settings.gradle.kts | head -n 1)
          test -n "$FILE"
          echo "PROJECT_DIR=$(dirname "$FILE")" >> $GITHUB_ENV

      - name: Automatic Kotlin fixes
        run: |
          FILE="$PROJECT_DIR/app/src/main/java/com/example/ui/screens/FlightLiveViewScreen.kt"
          if [ -f "$FILE" ]; then
            sed -i 's/fixType == 0/fixType == "0"/g' "$FILE"
          fi

          FILE="$PROJECT_DIR/app/src/main/java/com/example/video/NetworkCameraDiscovery.kt"
          if [ -f "$FILE" ]; then
            sed -i 's/hostName/host/g' "$FILE"
          fi

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NexendFLY-APK
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
