
name: Build NexendFLY APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'apk_src.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract ZIP
        run: |
          test -f apk_src.zip
          mkdir -p source
          unzip -q apk_src.zip -d source

      - name: Locate project
        run: |
          FILE=$(find source \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)
          test -n "$FILE"
          PROJECT_DIR=$(dirname "$FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.1'

      - name: Generate Gradle Wrapper if missing
        run: |
          cd "$PROJECT_DIR"

          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 9.1.1
          fi

          chmod +x gradlew

      - name: Automatic Kotlin fixes
        run: |
          FILE="$PROJECT_DIR/app/src/main/java/com/example/ui/screens/FlightLiveViewScreen.kt"
          if [ -f "$FILE" ]; then
            sed -i 's/fixType == 0/fixType == "0"/g' "$FILE"
          fi

          FILE="$PROJECT_DIR/app/src/main/java/com/example/video/NetworkCameraDiscovery.kt"
          if [ -f "$FILE" ]; then
            sed -i 's/hostName/host/g' "$FILE"
          fi

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NexendFLY-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
