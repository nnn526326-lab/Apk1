
name: Build NexendFLY APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'apk_src.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Extract ZIP
        run: |
          test -f apk_src.zip
          mkdir -p source
          unzip -q apk_src.zip -d source

      - name: Locate Project
        run: |
          FILE=$(find source \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)

          if [ -z "$FILE" ]; then
            echo "ERROR: Gradle project tidak ditemukan!"
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$FILE")" >> "$GITHUB_ENV"

      - name: Automatic Kotlin Fixes
        run: |
          FILE="$PROJECT_DIR/app/src/main/java/com/example/ui/screens/FlightLiveViewScreen.kt"
          if [ -f "$FILE" ]; then
            sed -i 's/fixType == 0/fixType == "0"/g' "$FILE"
          fi

          FILE="$PROJECT_DIR/app/src/main/java/com/example/video/NetworkCameraDiscovery.kt"
          if [ -f "$FILE" ]; then
            sed -i 's/hostName/host/g' "$FILE"
          fi

      - name: Build APK and Capture Errors
        run: |
          cd "$PROJECT_DIR"

          set +e
          gradle assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          BUILD_STATUS=${PIPESTATUS[0]}
          set -e

          echo ""
          echo "========== COMPILATION ERRORS =========="
          grep -n -E '^e: | error:|What went wrong|Caused by:' "$GITHUB_WORKSPACE/build.log" | head -n 100 || true
          echo "========================================="

          exit "$BUILD_STATUS"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NexendFLY-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NexendFLY-Build-Log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
